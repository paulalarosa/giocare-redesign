<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gio Care · Horários de atendimento</title>
  <link rel="icon" href="assets/img/gio-care-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Bricolage+Grotesque:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="brand" href="index.html" aria-label="Gio Care">
        <img class="full lock-light" src="assets/img/gio-care-lockup-on-light.webp" alt="Gio Care" />
        <img class="full lock-dark" src="assets/img/gio-care-lockup-on-dark.webp" alt="Gio Care" hidden />
        <img class="mk" src="assets/img/gio-care-mark.png" alt="Gio Care" />
      </a>
      <span class="navlbl">Painel</span>
      <nav class="nav">
        <a href="dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="pacientes.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M16 4.5a3.2 3.2 0 0 1 0 6.3M15.5 20a5.5 5.5 0 0 0-2-4.3"/></svg>
          <span>Pacientes</span>
        </a>
        <a class="active" href="agenda.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>
          <span>Agenda</span>
        </a>
        <a href="financeiro.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 5.5h16v13H4zM4 10h16"/><path d="M8 14.5h4"/></svg>
          <span>Financeiro</span>
        </a>
      </nav>

      <span class="navlbl">Clínico</span>
      <nav class="nav">
        <a href="consulta.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 10a6.5 6.5 0 0 0 13 0M12 16.5V21"/></svg>
          <span>Consultas</span>
        </a>
        <a href="prontuario.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 3h9l4 4v14H6z"/><path d="M9 8h4M9 12h7M9 16h5"/></svg>
          <span>Prontuários</span>
        </a>
        <a href="exames.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10 3v5.2L5.6 16.4A3.6 3.6 0 0 0 8.9 21.5h6.2a3.6 3.6 0 0 0 3.3-5.1L14 8.2V3"/><path d="M8.5 3h7M7.6 14.5h8.8"/></svg>
          <span>Exames</span>
        </a>
        <a href="receitas.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h6M9 15h4"/></svg>
          <span>Receitas</span>
        </a>
      </nav>
      <div class="spacer"></div>
      <button id="theme" class="icon-btn" style="margin:0 8px 12px;align-self:flex-start" aria-label="Alternar tema">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div class="user"><div class="av">HP</div><div class="u-meta"><div class="n">Dra. Helena Prado</div><div class="r">Nutrologia · CRM 00000</div></div></div>
    </aside>

    <div class="main">
      <div class="topbar">
        <a class="btn btn-soft" href="agenda.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>Agenda</a>
        <div class="actions"><button class="btn btn-primary"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Adicionar horário</button></div>
      </div>
      <main class="content">
        <div class="page-head">
          <span class="ey">Agenda · configuração</span>
          <h1>Horários de <em class="grad-text">atendimento</em>.</h1>
        </div>
        <div id="days" style="display:grid;gap:16px;max-width:760px"></div>
      </main>
    </div>
  </div>

  <dialog class="confirm" id="delModal">
    <div class="body"><div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></div><h3>Remover horário?</h3><p>O bloco deixa de aceitar novos agendamentos.</p></div>
    <div class="foot"><button class="btn btn-ghost2" id="delCancel">Voltar</button><button class="btn btn-danger" id="delConfirm">Remover</button></div>
  </dialog>

  <script src="assets/app.js"></script>
  <script>
    const semana = {
      "Segunda-feira":[["08:00","12:00",true],["14:00","18:00",true]],
      "Terça-feira":[["08:00","12:00",true],["14:00","18:00",true]],
      "Quarta-feira":[["08:00","13:00",true]],
      "Quinta-feira":[["08:00","12:00",true],["14:00","18:00",true]],
      "Sexta-feira":[["08:00","12:00",true]],
      "Sábado":[["08:00","11:00",false]],
    };
    const wrap=document.getElementById('days');
    Object.entries(semana).forEach(([dia,slots])=>{
      const card=document.createElement('div'); card.className='card'; card.style.padding='16px 18px';
      card.innerHTML=`<div style="font-family:var(--font-display);font-size:1.15rem;margin-bottom:12px">${dia}</div>`;
      const list=document.createElement('div'); list.style.display='grid'; list.style.gap='8px';
      slots.forEach(([ini,fim,ativo])=>{
        const r=document.createElement('div');
        r.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;border:1px solid var(--border);border-radius:11px;padding:10px 14px';
        r.innerHTML=`<span style="font-family:var(--font-mono);font-size:14px">${ini} às ${fim}</span>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="chip ${ativo?'paid':'muted'}"><i></i>${ativo?'Ativo':'Inativo'}</span>
            <button class="btn btn-soft" style="padding:6px 12px;font-size:12.5px">${ativo?'Desativar':'Ativar'}</button>
            <button class="icon-btn del" aria-label="Remover" style="padding:7px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
          </div>`;
        list.appendChild(r);
      });
      card.appendChild(list); wrap.appendChild(card);
    });

    const modal=document.getElementById('delModal');
    wrap.addEventListener('click',e=>{ if(e.target.closest('.del')) modal.showModal(); });
    document.getElementById('delCancel').onclick=()=>modal.close();
    document.getElementById('delConfirm').onclick=()=>modal.close();
    modal.addEventListener('click',e=>{ if(e.target===modal) modal.close(); });
  </script>
</body>
</html>
