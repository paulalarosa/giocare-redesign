        <a href="agenda.html">

        <a class="u-link" href="perfil.html" aria-label="Abrir meu perfil">

</div>

    <div class="main">
      <div class="topbar">
        <a class="btn btn-soft" href="pacientes.html"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>Pacientes</a>
        <div class="actions">
          <button id="theme" class="icon-btn" aria-label="Alternar entre claro e escuro">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </div>
      <main id="conteudo" class="content">
        <div class="page-head">
          <h1>Cadastrar <em class="grad-text">paciente</em>.</h1>
        </div>
        <form class="card form-card">
          <div class="form-grid">
            <div class="field full"><label for="pNome">Nome completo</label><input id="pNome" required placeholder="Nome do paciente" /></div>
            <div class="field"><label for="e-mail">E-mail</label><input id="e-mail" type="email" placeholder="email@exemplo.com" /></div>
            <div class="field"><label for="telefone">Telefone</label><input id="telefone" placeholder="(00) 00000-0000" /></div>
            <div class="field"><label for="pCpf">CPF</label><input id="pCpf" placeholder="000.000.000-00" /></div>
            <div class="field"><label for="pNasc">Data de nascimento</label><input id="pNasc" type="date" /><span class="hint" id="pIdade"></span></div>
            <div class="field"><label for="pSexo">Sexo</label><select id="pSexo"><option>Feminino</option><option>Masculino</option><option>Prefiro não informar</option></select></div>
            <div class="field"><label for="alergias">Alergias</label><input id="alergias" placeholder="Ex.: dipirona, frutos do mar…" /></div>
            <div class="field full"><label for="notas-de-relacionamento">Notas de relacionamento</label><textarea id="notas-de-relacionamento" placeholder="Detalhes pessoais que ajudam no vínculo (hobbies, família, viagens)…"></textarea><span class="hint">Aparecem no cabeçalho da consulta, ao lado do coração.</span></div>
          </div>
          <div class="form-foot">
            <button type="submit" class="btn btn-primary">Salvar paciente</button>
            <a class="btn btn-ghost2" href="pacientes.html">Cancelar</a>
          </div>
        </form>
      </main>
    </div>
