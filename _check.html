<!DOCTYPE html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verificação: escrubbing e ordem do rodapé</title><style>
:root{--dur-1:120ms;--dur-2:180ms;--dur-3:260ms;--ease-out:cubic-bezier(0.22,1,0.36,1);
 --card:#FEFDFA;--background:#FEFDFA;--brand-texto:#bd374e;--muted-foreground:#565F59;--foreground:#1B211D;--border:#E6E2DA}
body{margin:0;background:#F6F4F1;font:15px system-ui;color:#2a2320}
.alto{height:130vh;display:grid;place-items:center;color:#8b8079;font:600 14px system-ui}
.nascente-aranha{margin:0;display:grid;place-items:center}
.nascente-aranha svg{display:block;width:240px;height:auto}
.nascente-aranha-anel{fill:none;stroke:#D9CFC5}
.nascente-aranha-eixo{stroke:#E7E0D9}
.nascente-aranha-area{fill:rgba(189,55,78,.22);stroke:#bd374e;stroke-width:2;transform-origin:95px 82px}
.nascente-aranha-no{fill:#bd374e}
#hud{position:fixed;top:8px;left:8px;z-index:99;background:#122535;color:#EAF0F5;
 font:500 12px/1.5 ui-monospace,monospace;padding:8px 12px;border-radius:8px;white-space:pre}
/* o rodape do AlertDialog, com a ORDEM DE DOM REAL do shadcn: [Cancel, Action] */
.dlg{max-width:20rem;margin:24px auto;padding:16px;border-radius:12px;background:var(--card);
 box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.dlg h2{margin:0 0 6px;font-size:16px;font-weight:500}
.dlg p{margin:0;font-size:14px;color:var(--muted-foreground)}
.ft{display:flex;flex-direction:column-reverse;gap:8px;margin:16px -16px -16px;padding:16px;
 border-top:1px solid var(--border)}
@media (min-width:640px){.ft{flex-direction:row;justify-content:flex-end}}
.b{font:500 14px system-ui;padding:9px 16px;border-radius:8px;border:0;background:var(--brand-texto);color:#fff}
.b.out{background:transparent;border:1px solid var(--border);color:var(--foreground)}
/* A aranha ABRE, em vez de aparecer pronta.

   O polígono é o achado: a forma dele É quais áreas foram conversadas. Abrindo
   do centro para fora, cada vértice chega no próprio raio, e o desenho conta a
   leitura em vez de só exibi-la. Uma vez por consulta, então cabe no orçamento
   de movimento; e são só `transform` e `opacity`.

   O estado final é o de REPOUSO: sem animação, ou com movimento reduzido, a
   aranha nasce pronta. */
@media (prefers-reduced-motion: no-preference) {
  [data-interface-theme="nascente"] .nascente-aranha-area {
    animation: nascente-aranha-abre 360ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  [data-interface-theme="nascente"] .nascente-aranha-no {
    animation: nascente-aranha-no 200ms cubic-bezier(0.22, 1, 0.36, 1)
      calc(200ms + var(--i, 0) * 40ms) both;
  }

  /* A abertura passa a depender de a aranha ENTRAR na tela.
     A aranha é renderizada num lugar só, `#prontuario-abcdefs` na página do
     paciente, e nasce ABAIXO DA DOBRA: presa ao tempo de montagem, ela abria
     fora da tela e a médica chegava nela já pronta, o que anula o motivo de
     abrir.
     A linha de tempo mora na `figure` e os filhos a referenciam pelo nome, e
     não `view()` em cada um: cada `circle` tem caixa própria, então `view()`
     individual daria a cada nó um progresso diferente e o escalonamento
     deixaria de ser a ordem das letras. Com uma linha só, o atraso vem do
     `animation-range`, porque `animation-delay` em tempo não existe em linha de
     tempo de rolagem.
     Atrás de `@supports` de propósito: onde não houver, valem as regras de
     tempo acima, que já entregam o mesmo desenho. */
  @supports (animation-timeline: view()) {
    [data-interface-theme="nascente"] .nascente-aranha {
      view-timeline-name: --aranha;
      view-timeline-axis: block;
    }
    [data-interface-theme="nascente"] .nascente-aranha-area {
      animation-timeline: --aranha;
      animation-duration: auto;
      animation-delay: 0s;
      animation-range: entry 18% entry 62%;
    }
    [data-interface-theme="nascente"] .nascente-aranha-no {
      animation-timeline: --aranha;
      animation-duration: auto;
      animation-delay: 0s;
      animation-range: entry calc(46% + var(--i, 0) * 6%)
        entry calc(66% + var(--i, 0) * 6%);
    }
  }
}
/* 🔴 NO PAPEL a aranha nasce pronta, sempre.
   Com linha de tempo de rolagem e preenchimento `both`, um elemento que ainda
   não entrou na tela fica no quadro inicial, que é `opacity: 0`. Imprimir uma
   página cuja aranha está abaixo da dobra sairia com o mapa clínico EM BRANCO.
   `animation: none` zera nome, tempo e linha de tempo de uma vez. */
@media print {
  [data-interface-theme="nascente"] .nascente-aranha-area,
  [data-interface-theme="nascente"] .nascente-aranha-no {
    animation: none;
    opacity: 1;
    transform: none;
  }
}

@keyframes nascente-aranha-abre {
  /* Nunca de `scale(0)`: a malha existe antes de a área ser desenhada. */
  from { opacity: 0; transform: scale(0.72); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes nascente-aranha-no {
  from { opacity: 0; }
  to { opacity: 1; }
</style>
<div id="hud">medindo…</div>
<div data-interface-theme="nascente">
  <div class="dlg">
    <h2>Encerrar a consulta?</h2>
    <p>Ordem de DOM igual à do shadcn: Cancelar primeiro, Ação depois.</p>
    <div class="ft" id="ft">
      <button class="b out" data-papel="cancelar">Voltar</button>
      <button class="b" data-papel="acao">Encerrar consulta</button>
    </div>
  </div>
  <div class="alto">role para baixo ↓</div>
  <figure class="nascente-aranha" id="ar"><svg viewBox="0 0 190 165">
    <polygon class="nascente-aranha-anel" points="95,20 160,58 160,106 95,144 30,106 30,58"/>
    <polygon class="nascente-aranha-anel" points="95,51 128,70 128,94 95,113 62,94 62,70"/>
    <line class="nascente-aranha-eixo" x1="95" y1="82" x2="95" y2="20"/>
    <line class="nascente-aranha-eixo" x1="95" y1="82" x2="160" y2="58"/>
    <line class="nascente-aranha-eixo" x1="95" y1="82" x2="160" y2="106"/>
    <line class="nascente-aranha-eixo" x1="95" y1="82" x2="95" y2="144"/>
    <line class="nascente-aranha-eixo" x1="95" y1="82" x2="30" y2="106"/>
    <line class="nascente-aranha-eixo" x1="95" y1="82" x2="30" y2="58"/>
    <polygon class="nascente-aranha-area" points="95,32 148,64 138,100 95,124 52,98 46,66"/>
    <circle class="nascente-aranha-no" cx="95" cy="32" r="4" style="--i:0"/><circle class="nascente-aranha-no" cx="148" cy="64" r="4" style="--i:1"/><circle class="nascente-aranha-no" cx="138" cy="100" r="4" style="--i:2"/><circle class="nascente-aranha-no" cx="95" cy="124" r="4" style="--i:3"/><circle class="nascente-aranha-no" cx="52" cy="98" r="4" style="--i:4"/><circle class="nascente-aranha-no" cx="46" cy="66" r="4" style="--i:5"/>
  </svg></figure>
  <div class="alto">fim</div>
</div>
<script>
const hud=document.getElementById('hud');
function ler(){
  const area=document.querySelector('.nascente-aranha-area');
  const a=area.getAnimations()[0];
  const cs=getComputedStyle(area);
  const nos=[...document.querySelectorAll('.nascente-aranha-no')].filter(n=>+getComputedStyle(n).opacity>.5).length;
  hud.textContent='scrollY '+Math.round(scrollY)
    +'
tl '+String(a&&a.currentTime).slice(0,7)
    +'
opac '+(+cs.opacity).toFixed(3)
    +'
scale '+cs.transform
    +'
nos '+nos+'/6';
}
addEventListener('scroll',ler,{passive:true}); setInterval(ler,120); ler();
</script>
