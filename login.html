<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gio Care · Acessar</title>
  <meta name="description" content="Entre no seu consultório Gio Care." />
  <meta name="theme-color" content="#F6F4F1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#122535" media="(prefers-color-scheme: dark)" />
  <link rel="canonical" href="https://paulalarosa.github.io/giocare-redesign/login.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Gio Care" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:title" content="Gio Care · Acessar" />
  <meta property="og:description" content="Entre no seu consultório Gio Care." />
  <meta property="og:url" content="https://paulalarosa.github.io/giocare-redesign/login.html" />
  <meta property="og:image" content="https://paulalarosa.github.io/giocare-redesign/assets/img/gio-care-lockup-on-dark.webp" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="assets/img/gio-care-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spline+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/tokens.css?v=20260824m" />
  <link rel="stylesheet" href="assets/app.css?v=20260824m" />
  <link rel="stylesheet" href="assets/pagina/login.css?v=20260824m" />
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <main class="auth-wrap" id="conteudo">
    <div class="auth-card">
      <a href="index.html">
        <img src="assets/img/gio-care-lockup-on-light.webp" class="auth-logo lock-light" alt="Gio Care" />
        <img src="assets/img/gio-care-lockup-on-dark.webp" class="auth-logo lock-dark" alt="Gio Care" hidden />
      </a>
      <h1>Acessar o painel</h1>
      <p class="auth-sub">Entre com sua conta do consultório.</p>
      <form id="formLogin">
        <div class="field campo"><label for="e-mail">E-mail</label><input id="e-mail" type="email" placeholder="seu@consultorio.com" required autocomplete="username" /></div>
        <div class="field campo-justo">
          <div class="linha-topo">
            <label for="senha">Senha</label><a class="esqueci" href="esqueci-senha.html">esqueci →</a>
          </div>
          <div class="senha-caixa">
            <input id="senha" type="password" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="olho" data-olho="senha" aria-pressed="false" aria-label="Mostrar senha">
              <svg class="aberto" aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="fechado" aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5a9.7 9.7 0 0 1 4.5 1.1M21.5 12S18 18.5 12 18.5a9.7 9.7 0 0 1-4.5-1.1M4 20 20 4"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-bloco btn-entrar">Entrar no consultório</button>
      </form>
      <div class="auth-rodape">
        <span>Ainda não tem conta?</span>
        <a href="criar-conta.html">criar conta →</a>
      </div>
    </div>
  </main>
  <script src="assets/app.js?v=20260824m"></script>
  <script src="assets/pagina/login.js?v=20260824m" defer></script>
</body>
</html>
