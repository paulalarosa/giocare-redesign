<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gio Care · Acessar</title>
  <meta name="description" content="Entre no seu consultório Gio Care." />
  <meta name="theme-color" content="#F6F4F1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#122535" media="(prefers-color-scheme: dark)" />
  <link rel="canonical" href="https://paulalarosa.github.io/giocare-redesign/login.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Gio Care" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:title" content="Gio Care · Acessar" />
  <meta property="og:description" content="Entre no seu consultório Gio Care." />
  <meta property="og:url" content="https://paulalarosa.github.io/giocare-redesign/login.html" />
  <meta property="og:image" content="https://paulalarosa.github.io/giocare-redesign/assets/img/gio-care-lockup-on-dark.webp" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="assets/img/gio-care-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spline+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/tokens.css?v=20260820j" />
  <link rel="stylesheet" href="assets/app.css?v=20260820j" />
  <link rel="stylesheet" href="assets/pagina/login.css?v=20260820j" />
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <main class="auth-wrap" id="conteudo">
    <div class="auth-card">
      <img src="assets/img/gio-care-lockup-on-light.webp" class="lock-light" alt="Gio Care" style="height:30px;margin-bottom:24px" />
      <img src="assets/img/gio-care-lockup-on-dark.webp" class="lock-dark" alt="Gio Care" style="height:30px;margin-bottom:24px" hidden />
      <h1 style="font-size:1.9rem;margin-bottom:6px">Acessar o painel</h1>
      <p style="color:var(--muted-foreground);font-size:14px;margin:0 0 24px">Entre com sua conta do consultório.</p>
      <form id="formLogin">
        <div class="field" style="margin-bottom:16px"><label for="e-mail">E-mail</label><input id="e-mail" type="email" placeholder="seu@consultorio.com" required autocomplete="username" /></div>
        <div class="field" style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <label for="senha">Senha</label><a class="esqueci" href="#">esqueci →</a>
          </div>
          <input id="senha" type="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:18px;padding:12px">Entrar no consultório</button>
      </form>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:20px;font-family:var(--font-label);font-weight:600;font-size:11.5px">
        <span style="color:var(--faint-foreground)">Ainda não tem conta?</span>
        <a href="criar-conta.html" style="color:var(--brand-1)">criar conta →</a>
      </div>
    </div>
  </main>
  <script src="assets/app.js?v=20260820j"></script>
  <script src="assets/pagina/login.js?v=20260820j" defer></script>
</body>
</html>
