<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gio Care · Nova consulta</title>
  <link rel="icon" href="assets/img/gio-care-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Bricolage+Grotesque:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/tokens.css?v=20260819c" />
  <link rel="stylesheet" href="assets/app.css?v=20260819c" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="brand" href="index.html" aria-label="Gio Care">
        <img class="full lock-light" src="assets/img/gio-care-lockup-on-light.webp" alt="Gio Care" />
        <img class="full lock-dark" src="assets/img/gio-care-lockup-on-dark.webp" alt="Gio Care" hidden />
        <img class="mk" src="assets/img/gio-care-mark.png" alt="Gio Care" />
      </a>
      <span class="navlbl">Painel</span>
      <nav class="nav">
        <a href="dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="pacientes.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M16 4.5a3.2 3.2 0 0 1 0 6.3M15.5 20a5.5 5.5 0 0 0-2-4.3"/></svg>
          <span>Pacientes</span>
        </a>
        <a class="active" href="agenda.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>
          <span>Agenda</span>
        </a>
        <a href="financeiro.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 5.5h16v13H4zM4 10h16"/><path d="M8 14.5h4"/></svg>
          <span>Financeiro</span>
        </a>
      </nav>

      <span class="navlbl">Clínico</span>
      <nav class="nav">
        <a href="consulta.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 10a6.5 6.5 0 0 0 13 0M12 16.5V21"/></svg>
          <span>Consultas</span>
        </a>
        <a href="prontuario.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 3h9l4 4v14H6z"/><path d="M9 8h4M9 12h7M9 16h5"/></svg>
          <span>Prontuários</span>
        </a>
        <a href="exames.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10 3v5.2L5.6 16.4A3.6 3.6 0 0 0 8.9 21.5h6.2a3.6 3.6 0 0 0 3.3-5.1L14 8.2V3"/><path d="M8.5 3h7M7.6 14.5h8.8"/></svg>
          <span>Exames</span>
        </a>
        <a href="receitas.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h6M9 15h4"/></svg>
          <span>Receitas</span>
        </a>
      </nav>
      <div class="spacer"></div>
      <button id="theme" class="icon-btn" style="margin:0 8px 12px;align-self:flex-start" aria-label="Alternar tema">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div class="user"><div class="av">HP</div><div class="u-meta"><div class="n">Dra. Helena Prado</div><div class="r">Nutrologia · CRM-RJ 00000</div></div></div>
    </aside>

    <div class="main">
      <div class="topbar">
        <a class="btn btn-soft" href="agenda.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>Agenda</a>
      </div>
      <main class="content">
        <div class="page-head">
          <h1>Agendar <em class="grad-text">consulta</em>.</h1>
        </div>
        <form class="card form-card" onsubmit="event.preventDefault();window.location.href='agenda.html'">
          <div class="form-grid">
            <div class="field full"><label>Paciente</label><select><option>Marina T.</option><option>Paulo R.</option><option>Helena M.</option><option>+ Cadastrar novo paciente</option></select></div>
            <div class="field"><label>Data</label><input type="date" /></div>
            <div class="field"><label>Hora</label><input type="time" /></div>
            <div class="field"><label>Duração (min)</label><input type="number" value="40" min="10" max="180" step="5" /></div>
            <div class="field"><label>Valor (R$)</label><input placeholder="0,00" inputmode="decimal" /></div>
            <div class="field"><label>Tipo</label><select><option>1ª consulta</option><option>Retorno</option></select></div>
            <div class="field"><label>Motivo</label><select><option>Emagrecimento</option><option>Saúde metabólica</option><option>Ganho de massa muscular</option><option>Performance esportiva</option><option>Distúrbio hormonal</option><option>Outro</option></select></div>
            <div class="field full"><label>Observações</label><textarea placeholder="Notas para a consulta (opcional)…"></textarea></div>
          </div>
          <div class="form-foot">
            <button type="submit" class="btn btn-primary">Agendar consulta</button>
            <a class="btn btn-ghost2" href="agenda.html">Cancelar</a>
          </div>
        </form>
      </main>
    </div>
  </div>
  <script src="assets/app.js?v=20260819c"></script>
  <script>
    const form = document.querySelector('form');
    if (form) form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!form.reportValidity()) return;
      const b = form.querySelector('button[type=submit]');
      if (b) { b.disabled = true; b.style.opacity = '.6'; b.textContent = 'Agendando…'; }
      setTimeout(() => {
        sessionStorage.setItem('gio.toast', 'Consulta agendada. O paciente recebe a confirmação.');
        location.href = 'agenda.html';
      }, 600);
    });
  </script>
</body>
</html>
