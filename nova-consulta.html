    <div class="main">
      <div class="topbar">
        <a class="btn btn-soft" href="agenda.html"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>Agenda</a>
        <div class="actions">
          <button id="theme" class="icon-btn" aria-label="Alternar entre claro e escuro">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </div>
      <main id="conteudo" class="content">
        <div class="page-head">
          <h1>Agendar <em class="grad-text">consulta</em>.</h1>
        </div>
        <form class="card form-card" id="formConsulta">
          <div class="form-grid">
            <div class="field full"><label for="paciente">Paciente</label><select id="paciente"><option>Marina T.</option><option>Paulo R.</option><option>Helena M.</option><option>+ Cadastrar novo paciente</option></select></div>
            <div class="field"><label for="data">Data</label><input id="data" type="date" /></div>
            <div class="field"><label for="hora">Hora</label><input id="hora" type="time" /></div>
            <div class="field"><label for="duracao-min">Duração (min)</label><input id="duracao-min" type="number" value="40" min="10" max="180" step="5" /></div>
            <div class="field"><label for="valor-r">Valor (R$)</label><input id="valor-r" placeholder="0,00" inputmode="decimal" /></div>
            <div class="field"><label for="tipo">Tipo</label><select id="tipo"><option>1ª consulta</option><option>Retorno</option></select></div>
            <div class="field"><label for="motivo">Motivo</label><select id="motivo"><option>Emagrecimento</option><option>Saúde metabólica</option><option>Ganho de massa muscular</option><option>Performance esportiva</option><option>Distúrbio hormonal</option><option>Outro</option></select></div>
            <div class="field full"><label for="observacoes">Observações</label><textarea id="observacoes" placeholder="Notas para a consulta (opcional)…"></textarea></div>
          </div>
          <div class="form-foot">
            <button type="submit" class="btn btn-primary">Agendar consulta</button>
            <a class="btn btn-ghost2" href="agenda.html">Cancelar</a>
          </div>
        </form>
      </main>
